<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Information App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Weather Information</h1>

        <p class="subtitle">
            Check current weather information for any city
        </p>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>
        </div>

        <p id="message"></p>

        <div id="weatherCard" class="weather-card">

            <h2 id="cityName">City</h2>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <p id="description">Weather condition</p>

            <div class="details">

                <div>
                    <strong>Humidity</strong>
                    <span id="humidity">--</span>%
                </div>

                <div>
                    <strong>Wind Speed</strong>
                    <span id="windSpeed">--</span> m/s
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
